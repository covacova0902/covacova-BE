spring:
  datasource:
    url: ${COVA_LOCAL_DB_URL}
    username: ${COVA_LOCAL_DB_USERNAME}
    password: ${COVA_LOCAL_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: DEBUG