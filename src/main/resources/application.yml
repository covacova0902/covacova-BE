spring:
  application:
    name: covacova
  profiles:
    active: ${PROFILE:local}
  #created_at 시간을 서울 시간으로
  jackson:
    time-zone: Asia/Seoul
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /api/swagger-ui.html
    enabled: true
    #method 순서로 정렬(get,post, put, delete)
    operations-sorter: method
    #알파벳 순서로 정렬
    tags-sorter: alpha
    #실행시간 표시
    display-request-duration: true
  #서버가 받는 데이터 타입 설정
  default-consumes-media-type: application/json;charset=UTF-8
  #서버가 반환하는 데이터 타입 설정
  default-produces-media-type: application/json;charset=UTF-8
jwt:
  secret: ${JWT_SECRET}
  access-expiration-millis: 3600000
  refresh-expiration-millis: 1209600000
